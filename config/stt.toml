[audio]

# Audio input settings used by the microphone processing pipeline.
# It is recommended not to change these values unless you know what you are doing.

# Number of audio samples captured per second.
# 16000 Hz is the standard sample rate used by most speech-recognition models.
sample_rate = 16000

# Number of audio channels.
# 1 = mono, 2 = stereo.
# Speech recognition normally works best with mono audio.
channels = 1

# Number of audio samples processed in one audio block.
# Smaller values reduce latency but increase CPU overhead.
# Larger values reduce CPU overhead but increase latency.
blocksize = 512

# Internal format of audio samples.
# float32 is commonly used by the Sounddevice.
dtype = "float32"

[kws]

# Global hotkey, that awakens Assistant without need to say Atlas
awake_keybind = "<ctrl>+<alt>+w"

# Directory containing the Sherpa-ONNX Keyword Spotting model.
# The model is used to detect the assistant's wake word.
model_dir = "models/sherpa_onnx_kws"

# Path to the file containing all pseudo-phonemes/keyword definitions
# used by the Sherpa-ONNX KeywordSpotter model.
keywords_file = "keywords.txt"

# Number of CPU threads used by the Keyword Spotter.
# More threads can improve processing speed on some CPUs,
# but may also rapidly increase CPU usage.
num_threads = 1

# Minimum confidence score required for a detected keyword to be accepted.
# Lower values make the wake word easier to trigger but can cause
# more false activations.
# Higher values reduce false activations but may make the wake word
# harder to recognize.
score_threshold = 0.12


[vad]

model_path = "models/vad/silero_vad.onnx"

# Voice Activity Detection threshold.
# Determines how confidently the audio must be classified as speech.
# Lower values make VAD more sensitive to quiet speech/noise.
# Higher values require a stronger speech signal.
threshold = 0.5

# Amount of silence required before the current speech segment is considered finished.
# A higher value prevents the assistant from stopping too early,
# but increases the time before STT processing starts.
min_silence_duration_ms = 600

# Additional audio added around detected speech.
# This helps prevent the beginning or end of words from being cut off.
speech_pad_ms = 60

# Number of audio blocks kept before speech is detected.
# This acts as a small audio pre-roll so the beginning of a word
# is not lost when VAD activates.
# With sample_rate=16000 and blocksize=512, one block is ~32 ms.
# 6 blocks therefore keep roughly ~192 ms of audio before speech.
preroll_blocks = 6

[stt]

# Initial state of the speech-recognition system.
# SLEEPING means the assistant waits for its wake word
# before listening for a command.
start_state = "SLEEPING"

# Whisper model used for Speech-To-Text.
# Available sizes depend on the installed model files:
# "small", "small.$lang", "medium", "large-v3".
# Larger models generally provide better recognition,
# but require more CPU/RAM and are slower.
model_size = "small"

# Device used for speech recognition.
# "cpu" = process using the CPU.
# "cuda" = process using a compatible NVIDIA GPU.
device = "cpu"

# Directory where Faster-Whisper model files are downloaded/stored.
download_root = "models/faster-whisper"

# Beam search width used during transcription.
# Higher values can improve recognition quality,
# but increase processing time.
beam_size = 5

# Number of CPU threads used by STT.
# Increasing this can make transcription faster on multi-core CPUs,
# but also increases CPU usage.
cpu_threads = 6

# Maximum amount of time, in seconds, the assistant remains awake
# and waits for a command after detecting the wake word.
# After this period, it returns to the sleeping state.
awake_timeout = 15.0

# Minimum duration of a command required before sending it to STT.
# This helps ignore very short accidental sounds, clicks, or noise.
min_command_ms = 600.0


# --- EN Preset ---

# Language used by the STT model.
# "en" tells Whisper to expect English speech.
language = "en"

# Additional context given to Whisper during transcription.
# Useful for improving recognition of uncommon words or names.
initial_prompt = "Terms: Atlas."


# --- UK Preset ---

# Ukrainian language preset.
# Uncomment these two lines and comment out the EN preset above
# if you want Atlas to primarily recognize Ukrainian speech.

# language = "uk"
# initial_prompt = "Українська мова. Терміни: Atlas, асистент, атлас."
