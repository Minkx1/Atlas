name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [cpu, cuda]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev libasound2-dev binutils xz-utils

      - name: Install Dependencies (CPU Build)
        if: matrix.build_type == 'cpu'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller zstandard ordered-set
          pip install -r requirements.txt
          pip uninstall -y torch torchvision torchaudio
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Dependencies (CUDA Build)
        if: matrix.build_type == 'cuda'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller nuitka zstandard ordered-set
          pip install -r requirements.txt
          # Стандартний pip install torch підтягує CUDA-версію на Linux та Windows

      - name: Run Build Script (CPU)
        if: matrix.build_type == 'cpu'
        run: python build.py --cpu-only

      - name: Run Build Script (CUDA)
        if: matrix.build_type == 'cuda'
        run: python build.py

      - name: Handle Large Archives (Split if > 1.9GB)
        shell: bash
        run: |
          for f in *.tar.xz; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
              if [ "$size" -gt 2040109465 ]; then
                echo "[!] File $f is larger than 1.9GB ($size bytes). Splitting..."
                split -b 1800M --numeric-suffixes=1 -a 3 "$f" "${f}."
                rm "$f"
              else
                echo "[$] File $f is $size bytes (under 1.9GB limit). No split needed."
              fi
            fi
          done

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.tar.xz
            *.tar.xz.*
            *.tar.gz
            *.tag.gz.*
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}