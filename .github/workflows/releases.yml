name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild, for example v0.6.3
        required: true
        type: string
      source_ref:
        description: Commit or ref to build
        required: true
        default: master
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev libasound2-dev binutils xz-utils

      - name: Install Build & Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Run Build Script
        run: python scripts/build.py

      - name: Handle Large Archives (Split if > 1.9GB)
        shell: bash
        run: |
          for f in *.tar.xz; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
              if [ "$size" -gt 2040109465 ]; then
                echo "[!] File $f is larger than 1.9GB ($size bytes). Splitting..."
                split -b 1800M --numeric-suffixes=1 -a 3 "$f" "${f}."
                rm "$f"
              else
                echo "[$] File $f is $size bytes (under 1.9GB limit). No split needed."
              fi
            fi
          done

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          overwrite_files: true
          files: |
            *.tar.xz
            *.tar.xz.*
            *.tar.gz
            *.tar.gz.*
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}