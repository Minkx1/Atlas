[command]  # command metadata
id = "say_time"
description = "Says what's the time is right now."

[scripts]
time = "scripts/say_time.py"  # result1 is the string from main() function of say_time.py

[operator]
trigers = [
    "hey, what's the time",
    "what's the time",
    "what time is it",
]
say = [
    "Time is: $(time)",
    "It is $(time)"
]