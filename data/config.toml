# ==========================================
#         NEWT VOICE ASSISTANT CONFIG
# ==========================================

[app]
# How many seconds the assistant waits for a command after the wake word
awake_timeout = 10.0
# Minimum phrase length in ms (protection against accidental sounds/clicks)
min_command_ms = 600.0
profiler_debug = true
[audio]
sample_rate = 16000
channels = 1
# 512 -> 32 ms in 1 audio chunk
blocksize = 512
dtype = "float32"

[kws]
model_dir = "./data/models/sherpa_onnx_kws"
keywords_file = "keywords.txt"
num_threads = 2
score_threshold = 0.12

[vad]
threshold = 0.5
min_silence_duration_ms = 600
speech_pad_ms = 60
# ~400 ms preroll before speach (12 blocks * 32 ms)
preroll_blocks = 12

[whisper]
model_size = "small" # "small", "small.$lang", "medium", "large-v3"
device = "cpu"        # "cpu" or "cuda"
download_root = "./data/models/whisper_models_cache"
compute_type = "int8"
beam_size = 5
cpu_threads = 6

# --- EN Preset ---
language = "en"
initial_prompt = "English language, speech to an assistant. Terms: Newt, Python, C++, code, programming, Arch, Cachy, terminal."

