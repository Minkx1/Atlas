# ==========================================
#         NEWT VOICE ASSISTANT CONFIG
# ==========================================

[app]
name = "Newt"
# name = "Atlas"
username = "sir"
profiler = true  # If true, shows full debug and profiler info: CPU and RAM Usage per each state, time, delay and efficiency of every step
log = true  # If true - all events will be logged and put into $DATA / logs /

[op]
builtin_commands = "builtin_commands.json"

[audio]
sample_rate = 16000
channels = 1
# 512 -> 32 ms in 1 audio chunk
blocksize = 512
dtype = "float32"

[llm]
model_path = "models/llm_models/Qwen2.5-3B-Instruct-Uncensored-Test-Q3_K_M.gguf"
# initial_prompt = "Ти голосовий асистент 'Newt'(Ньют). Відопвідай лаконічно й точно, Українською мовою."
initial_prompt = """You are Newt, a helpful AI voice assistant.

### Identity
- Your name: Newt
- User's name: Sir

### Rules
1. Always address the user as "Sir".
2. Respond strictly in plain English text.
3. Do NOT use any emojis, symbols, or markdown formatting.
4. Keep all responses short, concise, and direct (3-4 sentences max).
"""
context_tokens = 2048
max_msg_tokens = 512
temperature = 0.7

[kws]
model_dir = "models/sherpa_onnx_kws"
keywords_file = "keywords.txt"
# keywords_file = "keywords_atlas.txt"
num_threads = 1
score_threshold = 0.12

[vad]
threshold = 0.5
min_silence_duration_ms = 600
speech_pad_ms = 60
# ~400 ms preroll before speech (12 blocks * 32 ms)
preroll_blocks = 6

[tts]
model_path = "models/piper/en_US-lessac-medium.onnx"
# model_path = "models/piper/uk_UA-ukrainian_tts-medium.onnx"
use_cuda = false
volume = 1.0
length_scale = 0.75  # Speed of speech. 1.0 is default, 2.0 - twice as slow
noise_scale = 1.0  # more audio variation
noise_w_scale = 1.0  # more speaking variation
normalize_audio = false  # use raw audio from voice
silence_duration = 0.0

[stt]
start_state = "SLEEPING"
model_size = "small" # "small", "small.$lang", "medium", "large-v3"
device = "cpu"        # "cpu" or "cuda"
download_root = "models/faster-whisper"
compute_type = "int8"
beam_size = 5
cpu_threads = 6

awake_timeout = 15.0  # How many seconds the assistant waits for a command after the wake word
min_command_ms = 600.0  # Minimum phrase length in ms (protection against accidental sounds/clicks)
# --- EN Preset ---
language = "en"
initial_prompt = "English language, speech to an assistant. Terms: Newt, Python, C++, code, programming, Linux, Arch, Cachy, terminal."

# # --- UK preset  ---
# language = "uk"
# initial_prompt = "Українська мова. Терміни: Newt, асистент, нют, н'ют, ньют."