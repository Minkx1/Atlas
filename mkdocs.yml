site_name: Atlas Docs
site_description: A fast, AI-powered, fully offline voice assistant.
site_author: Minkx1
site_url: https://minkx1.github.io/Atlas/
repo_name: Minkx1/Atlas
repo_url: https://github.com/Minkx1/Atlas

theme:
  name: material
  logo: assets/atlas.svg
  favicon: assets/atlas.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Start:
      - Overview: index.md
      - Installation: installation.md
  - Understand:
      - Architecture: architecture.md
  - Extend:
      - Plugin API: plugins.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

extra_css:
  - assets/docs.css