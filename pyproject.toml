[project]
name = "atlas"
version = "0.6.1"
description = "A fast, private and 100% offline personal AI Voice Assistant."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Minkx1", email = "zakalata.mark@gmail.com" }]
dependencies = [
    "numpy",
    "scipy",
    "onnxruntime",
    "tokenizers",
    "hf_xet",
    "textual",
    "rich",
    "pynput",
    "sounddevice",
    "soundfile",
    "faster-whisper",
    "sherpa-onnx",
    "piper-tts",
    "llama-cpp-python",
]

[project.urls]
Homepage = "https://github.com/Minkx1/Atlas"
Repository = "https://github.com/Minkx1/Atlas"
Documentation = "https://minkx1.github.io/Atlas/"
Issues = "https://github.com/Minkx1/Atlas/issues"
Changelog = "https://github.com/Minkx1/Atlas/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "pyinstaller", "commitizen"]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DTZ", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.commitizen]
version_scheme = "semver"
version_provider = "pep621"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
version_files = ["src/_version.py:__version__"]
